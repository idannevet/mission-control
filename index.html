<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרכז משימות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:       #0d1240;
  --navy-light: #1a2060;
  --pink:       #e91e8c;
  --pink-light: #ff4db3;
  --pink-bg:    #fce4f1;
  --white:      #ffffff;
  --gray-50:    #f8fafc;
  --gray-100:   #f1f5f9;
  --gray-200:   #e2e8f0;
  --gray-300:   #cbd5e1;
  --gray-500:   #64748b;
  --gray-700:   #334155;
  --gray-900:   #0f172a;
  --green:      #22c55e;
  --green-bg:   #dcfce7;
  --orange:     #f97316;
  --orange-bg:  #ffedd5;
  --red:        #ef4444;
  --red-bg:     #fee2e2;
  --blue:       #3b82f6;
  --blue-bg:    #dbeafe;
  --shadow-sm:  0 1px 3px rgba(0,0,0,.08);
  --shadow-md:  0 4px 16px rgba(0,0,0,.1);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.15);
  --r:  12px;
  --rs: 8px;
  --rx: 6px;
}

body {
  font-family: 'Heebo', sans-serif;
  background: var(--gray-100);
  color: var(--gray-900);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ─── Header ─── */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  color: #fff;
  padding: 0 20px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-md);
  position: sticky; top: 0; z-index: 200;
  gap: 12px;
}
.header-logo {
  display: flex; align-items: center; gap: 11px;
  font-weight: 800; font-size: 19px; flex-shrink: 0;
}
.header-logo .dot {
  width: 34px; height: 34px;
  background: var(--pink); border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  box-shadow: 0 3px 10px rgba(233,30,140,.4);
}
.header-right { display: flex; align-items: center; gap: 8px; }
.search-wrap { position: relative; }
.search-icon {
  position: absolute; right: 11px; top: 50%;
  transform: translateY(-50%);
  font-size: 13px; color: rgba(255,255,255,.5); pointer-events: none;
}
.search-input {
  padding: 8px 34px 8px 14px;
  border: 1.5px solid rgba(255,255,255,.15); border-radius: var(--rs);
  font-size: 13px; font-family: 'Heebo', sans-serif;
  background: rgba(255,255,255,.08); color: #fff;
  width: 200px; outline: none; transition: all .15s; text-align: right;
}
.search-input::placeholder { color: rgba(255,255,255,.4); }
.search-input:focus {
  border-color: var(--pink); background: rgba(255,255,255,.13);
  box-shadow: 0 0 0 3px rgba(233,30,140,.15);
}
.hdr-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 12px; border-radius: var(--rx);
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  border: 1.5px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08); color: #fff;
  transition: all .15s; font-family: 'Heebo', sans-serif;
  white-space: nowrap;
}
.hdr-btn:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.35); }

/* ─── Layout ─── */
.layout { display: flex; flex: 1; height: calc(100vh - 62px); overflow: hidden; }

/* ─── Sidebar ─── */
.sidebar {
  width: 255px; min-width: 255px;
  background: var(--white);
  border-left: 1px solid var(--gray-200);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-top { padding: 18px 14px 10px; border-bottom: 1px solid var(--gray-100); }
.sidebar-label { font-size: 11px; font-weight: 700; color: var(--gray-500); }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
.sec-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 11px; border-radius: var(--rs);
  cursor: pointer; transition: all .13s; margin-bottom: 2px;
}
.sec-item:hover { background: var(--gray-100); }
.sec-item.active {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  color: #fff;
}
.sec-emoji { font-size: 17px; width: 24px; text-align: center; flex-shrink: 0; }
.sec-name { font-size: 13.5px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-count {
  font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
  background: var(--gray-200); color: var(--gray-500); flex-shrink: 0;
}
.sec-item.active .sec-count { background: rgba(255,255,255,.2); color: #fff; }
.sec-btns { display: none; gap: 2px; }
.sec-item:hover .sec-btns, .sec-item.active .sec-btns { display: flex; }
.icon-btn {
  width: 25px; height: 25px; border-radius: 5px; border: none;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; opacity: .55; transition: all .13s;
}
.icon-btn:hover { opacity: 1; background: rgba(0,0,0,.08); }
.sec-item.active .icon-btn:hover { background: rgba(255,255,255,.18); }
.sidebar-foot { padding: 12px; border-top: 1px solid var(--gray-100); }

/* ─── Buttons ─── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--rx);
  font-size: 13.5px; font-weight: 600;
  cursor: pointer; border: none; transition: all .15s;
  white-space: nowrap; font-family: 'Heebo', sans-serif;
}
.btn-primary { background: var(--pink); color: #fff; }
.btn-primary:hover { background: var(--pink-light); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(233,30,140,.3); }
.btn-ghost { background: transparent; color: var(--gray-700); border: 1.5px solid var(--gray-200); }
.btn-ghost:hover { background: var(--gray-100); border-color: var(--gray-300); }
.btn-danger { background: var(--red-bg); color: var(--red); }
.btn-danger:hover { background: var(--red); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12.5px; }
.btn-full { width: 100%; justify-content: center; }

/* ─── Main ─── */
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
.main-header {
  padding: 22px 26px 14px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  background: var(--white); border-bottom: 1px solid var(--gray-200);
  position: sticky; top: 0; z-index: 50;
}
.main-h1 { font-size: 21px; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 9px; }
.main-sub { font-size: 13px; color: var(--gray-500); margin-top: 3px; }
.main-header-right { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }

/* ─── Filter bar ─── */
.filter-bar {
  display: flex; gap: 10px; flex-wrap: wrap;
  padding: 13px 26px;
  background: var(--gray-50); border-bottom: 1px solid var(--gray-200);
}
.fpill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 13px; border-radius: 20px;
  font-size: 12.5px; font-weight: 600;
  cursor: pointer; border: 2px solid transparent;
  transition: all .13s; user-select: none;
}
.fpill:hover { transform: translateY(-1px); }
.fpill.active { border-color: currentColor; }
.fpill.f-all   { background: var(--navy);      color: #fff; }
.fpill.f-todo  { background: var(--blue-bg);   color: var(--blue); }
.fpill.f-prog  { background: var(--orange-bg); color: var(--orange); }
.fpill.f-done  { background: var(--green-bg);  color: var(--green); }
.fpill.f-block { background: var(--red-bg);    color: var(--red); }
.fpill .cnt { background: rgba(0,0,0,.1); padding: 1px 7px; border-radius: 10px; font-size: 11.5px; }
.fpill.f-all .cnt { background: rgba(255,255,255,.2); }

/* ─── Mission Grid ─── */
.missions-wrap { padding: 20px 26px; flex: 1; }
.missions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }

/* ─── Mission Card ─── */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.mcard {
  background: var(--white);
  border-radius: var(--r); border: 1.5px solid var(--gray-200);
  padding: 16px; cursor: pointer; transition: all .18s;
  position: relative; overflow: hidden;
  animation: cardIn .2s ease both;
}
.mcard::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.mcard.s-todo::before  { background: var(--blue); }
.mcard.s-prog::before  { background: var(--orange); }
.mcard.s-done::before  { background: var(--green); }
.mcard.s-block::before { background: var(--red); }
.mcard:hover { border-color: var(--gray-300); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.mcard-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
.mcard-title { font-size: 14.5px; font-weight: 700; color: var(--gray-900); line-height: 1.5; flex: 1; }
.mcard-actions { display: flex; gap: 3px; opacity: 0; transition: opacity .13s; }
.mcard:hover .mcard-actions { opacity: 1; }
.mcard-desc { font-size: 12.5px; color: var(--gray-500); line-height: 1.6; margin-bottom: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mcard-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.sbadge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.sbadge.s-todo  { background: var(--blue-bg);   color: var(--blue); }
.sbadge.s-prog  { background: var(--orange-bg); color: var(--orange); }
.sbadge.s-done  { background: var(--green-bg);  color: var(--green); }
.sbadge.s-block { background: var(--red-bg);    color: var(--red); }
.dline { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 500; color: var(--gray-500); }
.dline.overdue { color: var(--red); font-weight: 600; }
.dline.soon    { color: var(--orange); font-weight: 600; }
.pdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.pdot.high   { background: var(--red); }
.pdot.medium { background: var(--orange); }
.pdot.low    { background: var(--green); }
.ccount { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--gray-500); margin-right: auto; }

/* ─── Empty / Welcome ─── */
.empty, .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 30px; }
.empty-ico, .welcome-ico { font-size: 64px; margin-bottom: 16px; }
.empty-t, .welcome-t { font-size: 19px; font-weight: 800; color: var(--gray-700); margin-bottom: 8px; }
.empty-sub, .welcome-sub { font-size: 13.5px; color: var(--gray-500); margin-bottom: 24px; line-height: 1.7; max-width: 360px; }

/* ─── Modal ─── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(13,18,64,.5); backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--white); border-radius: 16px;
  width: 100%; max-width: 560px; max-height: 90vh;
  overflow-y: auto; box-shadow: var(--shadow-lg);
  transform: translateY(20px) scale(.98); transition: transform .2s;
}
.overlay.open .modal { transform: translateY(0) scale(1); }
.modal-head { padding: 22px 22px 0; display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 17px; font-weight: 800; color: var(--navy); }
.modal-close {
  width: 30px; height: 30px; border-radius: 7px; border: none;
  background: var(--gray-100); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--gray-500); transition: all .13s;
}
.modal-close:hover { background: var(--gray-200); color: var(--gray-900); }
.modal-body { padding: 20px 22px; }
.modal-foot { padding: 0 22px 22px; display: flex; gap: 9px; justify-content: flex-start; }

/* ─── Form ─── */
.fg { margin-bottom: 16px; }
.fl { display: block; font-size: 12.5px; font-weight: 600; color: var(--gray-700); margin-bottom: 5px; }
.fi, .fs, .fta {
  width: 100%; padding: 9px 13px;
  border: 1.5px solid var(--gray-200); border-radius: var(--rs);
  font-size: 13.5px; font-family: 'Heebo', sans-serif;
  color: var(--gray-900); background: var(--white);
  transition: border-color .15s, box-shadow .15s; outline: none; text-align: right;
}
.fi:focus, .fs:focus, .fta:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(233,30,140,.1); }
.fta { resize: vertical; min-height: 80px; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }

/* Emoji picker */
.eg { display: grid; grid-template-columns: repeat(8,1fr); gap: 5px; margin-top: 7px; }
.eo { font-size: 21px; width: 36px; height: 36px; border-radius: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .13s; border: 2px solid transparent; }
.eo:hover { background: var(--gray-100); }
.eo.sel { background: var(--pink-bg); border-color: var(--pink); }

/* ─── Detail Slide-over ─── */
.detail-bg { position: fixed; inset: 0; background: rgba(13,18,64,.3); backdrop-filter: blur(2px); z-index: 900; opacity: 0; pointer-events: none; transition: opacity .25s; }
.detail-bg.open { opacity: 1; pointer-events: all; }
.detail-panel {
  position: fixed; left: 0; top: 62px; bottom: 0;
  width: 500px; background: var(--white);
  border-right: 1px solid var(--gray-200);
  box-shadow: 8px 0 32px rgba(0,0,0,.1);
  display: flex; flex-direction: column;
  z-index: 901;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
}
.detail-panel.open { transform: translateX(0); }
.detail-head {
  padding: 18px 18px 14px; border-bottom: 1px solid var(--gray-200);
  display: flex; align-items: flex-start; gap: 10px; flex-shrink: 0;
}
.detail-info { flex: 1; }
.detail-title { font-size: 17px; font-weight: 800; color: var(--navy); line-height: 1.4; }
.detail-sectag { font-size: 12px; color: var(--gray-500); margin-top: 3px; }
.detail-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.detail-body { padding: 18px; }
.df { margin-bottom: 18px; }
.df-label { font-size: 11px; font-weight: 700; color: var(--gray-500); margin-bottom: 6px; }
.df-val { font-size: 13.5px; color: var(--gray-700); line-height: 1.6; }
.df-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.status-opts { display: flex; gap: 7px; flex-wrap: wrap; }
.sopt { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid transparent; transition: all .13s; user-select: none; }
.sopt.s-todo  { background: var(--blue-bg);   color: var(--blue); }
.sopt.s-prog  { background: var(--orange-bg); color: var(--orange); }
.sopt.s-done  { background: var(--green-bg);  color: var(--green); }
.sopt.s-block { background: var(--red-bg);    color: var(--red); }
.sopt.sel { border-color: currentColor; box-shadow: 0 0 0 2px rgba(0,0,0,.04); }

/* ─── Files section ─── */
.files-section { border-top: 1px solid var(--gray-200); padding: 18px; }
.section-heading {
  font-size: 13px; font-weight: 700; color: var(--gray-700);
  margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
}
.section-heading .badge {
  background: var(--gray-200); padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
}
.file-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.file-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--rs);
  background: var(--gray-50); border: 1.5px solid var(--gray-200);
  transition: border-color .13s;
}
.file-item:hover { border-color: var(--gray-300); }
.file-thumb {
  width: 42px; height: 42px; border-radius: 6px;
  object-fit: cover; flex-shrink: 0; background: var(--gray-200);
}
.file-ico {
  width: 42px; height: 42px; border-radius: 6px;
  background: var(--gray-200); display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--gray-900); }
.file-size { font-size: 11px; color: var(--gray-500); margin-top: 2px; }
.file-actions { display: flex; gap: 3px; flex-shrink: 0; }
.upload-label {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--rx);
  border: 1.5px dashed var(--gray-300); color: var(--gray-500);
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all .15s; font-family: 'Heebo', sans-serif;
  background: transparent;
}
.upload-label:hover { border-color: var(--pink); color: var(--pink); background: var(--pink-bg); }

/* ─── Comments ─── */
.comments-wrap { border-top: 1px solid var(--gray-200); padding: 18px; }
.comment-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 13px; }
.citem { background: var(--gray-50); border-radius: var(--rs); padding: 11px; position: relative; }
.citem-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.citem-date { font-size: 11px; color: var(--gray-500); }
.citem-del { opacity: 0; background: none; border: none; cursor: pointer; color: var(--red); font-size: 13px; padding: 2px; border-radius: 4px; transition: opacity .13s; }
.citem:hover .citem-del { opacity: 1; }
.citem-text { font-size: 12.5px; color: var(--gray-700); line-height: 1.6; }
.c-row { display: flex; gap: 7px; }
.c-input { flex: 1; padding: 8px 11px; border: 1.5px solid var(--gray-200); border-radius: var(--rs); font-size: 13px; font-family: 'Heebo', sans-serif; outline: none; transition: border-color .15s; text-align: right; }
.c-input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(233,30,140,.1); }

/* ─── Toast ─── */
.toast-wrap { position: fixed; bottom: 22px; left: 22px; z-index: 2000; display: flex; flex-direction: column; gap: 7px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.toast {
  background: var(--navy); color: #fff;
  padding: 11px 16px; border-radius: 10px;
  font-size: 13px; font-weight: 500; box-shadow: var(--shadow-md);
  display: flex; align-items: center; gap: 9px;
  animation: toastIn .2s ease; max-width: 300px;
  transition: opacity .25s, transform .25s;
}
.toast.success { background: #16a34a; }
.toast.error   { background: var(--red); }

/* ─── Scrollbars ─── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gray-300); }

/* ─── View Tabs (Board / Calendar / AI) ─── */
.view-tabs { display: flex; gap: 4px; background: rgba(255,255,255,.08); padding: 3px; border-radius: var(--rs); border: 1.5px solid rgba(255,255,255,.15); }
.vtab {
  padding: 6px 12px; border-radius: 6px; border: none;
  background: transparent; color: rgba(255,255,255,.7);
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  font-family: 'Heebo', sans-serif; transition: all .15s; white-space: nowrap;
}
.vtab:hover { color: #fff; background: rgba(255,255,255,.07); }
.vtab.active { background: var(--pink); color: #fff; box-shadow: 0 2px 8px rgba(233,30,140,.35); }

/* ─── Calendar ─── */
.owner-tabs { display: flex; gap: 8px; padding: 14px 26px; background: var(--gray-50); border-bottom: 1px solid var(--gray-200); flex-wrap: wrap; }
.otab {
  padding: 7px 16px; border-radius: 22px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  border: 2px solid var(--gray-200); background: var(--white); color: var(--gray-700);
  transition: all .13s; user-select: none; font-family: 'Heebo', sans-serif;
}
.otab:hover { border-color: var(--gray-300); transform: translateY(-1px); }
.otab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.otab .ocnt { display: inline-block; background: rgba(0,0,0,.08); padding: 1px 7px; border-radius: 10px; font-size: 11px; margin-right: 5px; }
.otab.active .ocnt { background: rgba(255,255,255,.22); }

.cal-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 26px; background: var(--white); border-bottom: 1px solid var(--gray-200); }
.cal-title { font-size: 18px; font-weight: 800; color: var(--navy); }
.cal-nav { display: flex; gap: 6px; }
.cal-nav button { width: 34px; height: 34px; border-radius: var(--rs); border: 1.5px solid var(--gray-200); background: var(--white); cursor: pointer; font-size: 14px; color: var(--gray-700); transition: all .13s; }
.cal-nav button:hover { background: var(--gray-100); border-color: var(--gray-300); }
.cal-today { padding: 7px 14px; border-radius: var(--rs); border: 1.5px solid var(--gray-200); background: var(--white); cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--gray-700); font-family: 'Heebo', sans-serif; transition: all .13s; }
.cal-today:hover { background: var(--gray-100); }

.cal-grid { padding: 0 26px 26px; }
.cal-weekhead { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; padding: 14px 0 8px; }
.cal-weekday { font-size: 11.5px; font-weight: 700; color: var(--gray-500); text-align: center; padding: 4px 0; }
.cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.cal-day {
  background: var(--white); border: 1.5px solid var(--gray-200); border-radius: var(--rs);
  min-height: 110px; padding: 8px; display: flex; flex-direction: column; gap: 4px;
  transition: border-color .13s; position: relative;
}
.cal-day:hover { border-color: var(--gray-300); }
.cal-day.other { background: var(--gray-50); opacity: .55; }
.cal-day.today { border-color: var(--pink); border-width: 2px; box-shadow: 0 2px 8px rgba(233,30,140,.12); }
.cal-daynum { font-size: 12.5px; font-weight: 700; color: var(--gray-700); }
.cal-day.today .cal-daynum { color: var(--pink); }
.cal-mchip {
  font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 5px;
  cursor: pointer; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-right: 3px solid; transition: transform .1s;
}
.cal-mchip:hover { transform: translateX(-2px); }
.cal-mchip.s-todo  { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue); }
.cal-mchip.s-prog  { background: var(--orange-bg); color: var(--orange); border-color: var(--orange); }
.cal-mchip.s-done  { background: var(--green-bg);  color: var(--green);  border-color: var(--green); text-decoration: line-through; opacity: .75; }
.cal-mchip.s-block { background: var(--red-bg);    color: var(--red);    border-color: var(--red); }
.cal-mchip-time { opacity: .8; font-weight: 700; margin-left: 4px; }
.cal-noddl { padding: 12px 16px; margin: 14px 26px 0; background: var(--gray-50); border: 1.5px dashed var(--gray-300); border-radius: var(--rs); font-size: 12.5px; color: var(--gray-500); }
.cal-noddl strong { color: var(--gray-700); }
.cal-noddl-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.cal-noddl-item { background: var(--white); padding: 4px 9px; border-radius: 12px; font-size: 11.5px; cursor: pointer; border: 1px solid var(--gray-200); }
.cal-noddl-item:hover { border-color: var(--pink); }

.cal-mode-tabs { display: flex; gap: 4px; background: var(--gray-100); padding: 3px; border-radius: var(--rs); }
.cal-mode-tab { padding: 6px 14px; border-radius: 6px; border: none; background: transparent; color: var(--gray-700); font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: 'Heebo', sans-serif; transition: all .13s; }
.cal-mode-tab.active { background: var(--white); color: var(--navy); box-shadow: var(--shadow-sm); }
.cal-mode-tab:hover:not(.active) { background: rgba(0,0,0,.04); }

/* ─── Week / Day time grid ─── */
.cal-week-wrap { padding: 0 26px 26px; }
.cal-week-head {
  display: grid; gap: 0;
  position: sticky; top: 0; background: var(--white); z-index: 5;
  border-bottom: 1.5px solid var(--gray-200);
}
.cal-week-head.mode-week { grid-template-columns: 56px repeat(7, 1fr); }
.cal-week-head.mode-day  { grid-template-columns: 56px 1fr; }
.cal-headcell { padding: 11px 6px; font-size: 12px; text-align: center; color: var(--gray-700); border-left: 1px solid var(--gray-200); }
.cal-headcell:first-child { border-left: none; background: var(--gray-50); }
.cal-headcell .dayname { display: block; font-size: 11px; color: var(--gray-500); font-weight: 600; }
.cal-headcell .dayno { display: block; font-size: 17px; font-weight: 800; color: var(--gray-900); margin-top: 2px; }
.cal-headcell.today { background: rgba(233,30,140,.06); color: var(--pink); }
.cal-headcell.today .dayno, .cal-headcell.today .dayname { color: var(--pink); }
.cal-week-body {
  display: grid; gap: 0;
  border: 1.5px solid var(--gray-200); border-top: none;
  border-radius: 0 0 var(--rs) var(--rs);
  overflow: hidden;
  background: var(--white);
  position: relative;
}
.cal-week-body.mode-week { grid-template-columns: 56px repeat(7, 1fr); }
.cal-week-body.mode-day  { grid-template-columns: 56px 1fr; }
.cal-time-col { background: var(--gray-50); border-left: 1px solid var(--gray-200); }
.cal-time-cell {
  height: 50px; padding: 2px 6px; font-size: 10.5px; color: var(--gray-500);
  border-bottom: 1px dashed var(--gray-200); position: relative; text-align: center;
}
.cal-day-col {
  position: relative; border-left: 1px solid var(--gray-200);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 49px, var(--gray-100) 49px, var(--gray-100) 50px);
}
.cal-day-col.today { background-color: rgba(233,30,140,.025); }
.cal-day-col:first-of-type { /* leftmost day col */ }
.cal-now-line {
  position: absolute; left: 0; right: 0; height: 2px;
  background: var(--pink); z-index: 3; pointer-events: none;
}
.cal-now-line::before {
  content: ''; position: absolute; right: -5px; top: -4px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--pink);
  box-shadow: 0 0 6px rgba(233,30,140,.5);
}
.cal-mblock {
  position: absolute; left: 3px; right: 3px;
  padding: 4px 7px; border-radius: 5px; font-size: 11px;
  cursor: pointer; overflow: hidden; line-height: 1.3;
  border-right: 3px solid; transition: transform .1s, box-shadow .15s;
  z-index: 2;
}
.cal-mblock:hover { transform: scale(1.01); box-shadow: var(--shadow-sm); z-index: 4; }
.cal-mblock.s-todo  { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue); }
.cal-mblock.s-prog  { background: var(--orange-bg); color: var(--orange); border-color: var(--orange); }
.cal-mblock.s-done  { background: var(--green-bg);  color: var(--green);  border-color: var(--green); opacity: .6; }
.cal-mblock.s-block { background: var(--red-bg);    color: var(--red);    border-color: var(--red); }
.cal-mblock.deadline-only { background: repeating-linear-gradient(135deg, var(--red-bg), var(--red-bg) 5px, #fff 5px, #fff 8px); border-right-style: dashed; }
.cal-mblock-time { font-weight: 700; opacity: .85; font-size: 10px; display: block; }
.cal-mblock-name { font-weight: 600; }

/* ─── Schedule Proposal ─── */
.sched-overlay {
  position: fixed; inset: 0; background: rgba(13,18,64,.5); backdrop-filter: blur(4px);
  z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.sched-overlay.open { opacity: 1; pointer-events: all; }
.sched-modal {
  background: var(--white); border-radius: 16px;
  width: 100%; max-width: 700px; max-height: 88vh;
  overflow: hidden; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
  transform: translateY(20px) scale(.98); transition: transform .2s;
}
.sched-overlay.open .sched-modal { transform: translateY(0) scale(1); }
.sched-head { padding: 20px 22px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sched-summary { font-size: 13px; color: var(--gray-700); line-height: 1.65; flex: 1; }
.sched-list { flex: 1; overflow-y: auto; padding: 14px 22px; }
.sched-item {
  padding: 12px 14px; border-radius: var(--rs); border: 1.5px solid var(--gray-200);
  margin-bottom: 8px; transition: border-color .13s;
}
.sched-item:hover { border-color: var(--gray-300); }
.sched-item-head { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; flex-wrap: wrap; }
.sched-item-name { font-size: 13.5px; font-weight: 700; color: var(--gray-900); flex: 1; min-width: 140px; }
.sched-item-meta { font-size: 11.5px; color: var(--gray-500); }
.sched-item-when { font-size: 12.5px; font-weight: 700; color: var(--pink); background: var(--pink-bg); padding: 3px 9px; border-radius: 12px; }
.sched-item-reason { font-size: 12px; color: var(--gray-700); line-height: 1.55; padding-right: 4px; border-right: 2px solid var(--pink-bg); padding-right: 8px; }
.sched-foot { padding: 16px 22px; border-top: 1px solid var(--gray-200); display: flex; gap: 9px; justify-content: flex-start; background: var(--gray-50); }

/* ─── AI Assistant ─── */
.ai-wrap { padding: 22px 26px; flex: 1; display: flex; flex-direction: column; max-width: 880px; width: 100%; margin: 0 auto; }
.ai-quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.ai-qbtn {
  padding: 9px 14px; border-radius: 22px; cursor: pointer;
  background: var(--pink-bg); color: var(--pink); border: 1.5px solid transparent;
  font-size: 13px; font-weight: 600; font-family: 'Heebo', sans-serif;
  transition: all .13s;
}
.ai-qbtn:hover { background: var(--pink); color: #fff; transform: translateY(-1px); }
.ai-chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 8px 4px 14px; min-height: 240px; }
.ai-msg { display: flex; gap: 10px; max-width: 85%; }
.ai-msg.user { margin-right: auto; flex-direction: row-reverse; }
.ai-msg.bot { margin-left: auto; }
.ai-avatar { width: 32px; height: 32px; border-radius: 8px; background: var(--gray-200); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.ai-msg.user .ai-avatar { background: var(--navy); color: #fff; }
.ai-msg.bot .ai-avatar { background: var(--pink); color: #fff; }
.ai-bubble {
  padding: 10px 14px; border-radius: 12px;
  font-size: 13.5px; line-height: 1.65; color: var(--gray-900);
  background: var(--white); border: 1.5px solid var(--gray-200);
  white-space: pre-wrap; word-break: break-word;
}
.ai-msg.user .ai-bubble { background: var(--navy); color: #fff; border-color: var(--navy); }
.ai-bubble.thinking { color: var(--gray-500); font-style: italic; }
.ai-empty { text-align: center; padding: 50px 20px; color: var(--gray-500); }
.ai-empty .ico { font-size: 56px; margin-bottom: 12px; }
.ai-empty .t { font-size: 17px; font-weight: 800; color: var(--gray-700); margin-bottom: 6px; }
.ai-empty .s { font-size: 13px; line-height: 1.7; max-width: 360px; margin: 0 auto; }
.ai-input-row { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--gray-200); }
.ai-input { flex: 1; padding: 11px 14px; border: 1.5px solid var(--gray-200); border-radius: var(--rs); font-size: 13.5px; font-family: 'Heebo', sans-serif; outline: none; transition: border-color .15s; text-align: right; }
.ai-input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(233,30,140,.1); }

@media (max-width: 700px) {
  .sidebar { width: 56px; min-width: 56px; }
  .sec-name, .sec-count, .sec-btns, .sidebar-label { display: none; }
  .sidebar-foot .btn span { display: none; }
  .detail-panel { width: 100%; }
  .search-input { width: 140px; }
  .hdr-btn span { display: none; }
  .vtab { padding: 6px 9px; font-size: 11.5px; }
  .cal-day { min-height: 78px; padding: 5px; }
  .cal-mchip { font-size: 10px; padding: 2px 5px; }
}
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<header class="header">
  <div class="header-logo">
    <div class="dot">🎯</div>
    מרכז משימות
  </div>
  <div class="header-right">
    <div class="view-tabs" id="viewTabs">
      <button class="vtab active" data-view="board" onclick="setView('board')">📋 לוח</button>
      <button class="vtab" data-view="calendar" onclick="setView('calendar')">📅 לוח שנה</button>
      <button class="vtab" data-view="ai" onclick="setView('ai')">🤖 עוזר AI</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="gSearch" placeholder="חיפוש משימות..." oninput="onSearch(this.value)">
    </div>
    <div id="syncBadge" style="display:flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,.5);">
      <span id="syncDot" style="width:7px;height:7px;border-radius:50%;background:#64748b;flex-shrink:0;"></span>
      <span id="syncTxt">מתחבר...</span>
    </div>
    <button class="hdr-btn" onclick="exportData()" title="ייצוא נתונים">⬇️ <span>ייצוא</span></button>
    <label class="hdr-btn" title="ייבוא נתונים" style="cursor:pointer;">
      ⬆️ <span>ייבוא</span>
      <input type="file" accept=".json" style="display:none" onchange="importData(this)">
    </label>
  </div>
</header>

<!-- ═══ Layout ═══ -->
<div class="layout">
  <main class="main" id="main"></main>
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-label">קטגוריות</div>
    </div>
    <div class="sidebar-list" id="secList"></div>
    <div class="sidebar-foot">
      <button class="btn btn-primary btn-full btn-sm" onclick="openSecModal()">
        <span>+</span><span> קטגוריה חדשה</span>
      </button>
    </div>
  </aside>
</div>

<!-- ═══ Detail slide-over ═══ -->
<div class="detail-bg" id="detailBg" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="detail-head">
    <div style="display:flex;gap:7px;flex-shrink:0;">
      <button class="btn btn-ghost btn-sm" onclick="editCurrent()">✏️ עריכה</button>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-info">
      <div class="detail-title" id="dTitle"></div>
      <div class="detail-sectag" id="dSectag"></div>
    </div>
  </div>
  <div class="detail-scroll">
    <div class="detail-body" id="dBody"></div>
    <div class="files-section" id="dFiles"></div>
    <div class="comments-wrap" id="dComments"></div>
  </div>
</div>

<!-- ═══ Mission Modal ═══ -->
<div class="overlay" id="mOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="mTitle">משימה חדשה</div>
      <button class="modal-close" onclick="closeMModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label class="fl">שם משימה *</label>
        <input class="fi" id="mName" placeholder="מה צריך לבצע?">
      </div>
      <div class="fg">
        <label class="fl">תיאור</label>
        <textarea class="fta" id="mDesc" placeholder="הוסף פרטים, הקשר, הערות..."></textarea>
      </div>
      <div class="frow">
        <div class="fg">
          <label class="fl">סטטוס</label>
          <select class="fs" id="mStatus">
            <option value="todo">📋 ממתין</option>
            <option value="in-progress">⚡ בתהליך</option>
            <option value="done">✅ הושלם</option>
            <option value="blocked">🚫 חסום</option>
          </select>
        </div>
        <div class="fg">
          <label class="fl">עדיפות</label>
          <select class="fs" id="mPriority">
            <option value="medium">🟡 בינונית</option>
            <option value="high">🔴 גבוהה</option>
            <option value="low">🟢 נמוכה</option>
          </select>
        </div>
      </div>
      <div class="frow">
        <div class="fg">
          <label class="fl">תאריך ושעת יעד</label>
          <input type="datetime-local" class="fi" id="mDeadline">
        </div>
        <div class="fg">
          <label class="fl">קטגוריה</label>
          <select class="fs" id="mSection"></select>
        </div>
      </div>
      <div class="fg">
        <label class="fl">אחראי משימה</label>
        <select class="fs" id="mOwner">
          <option value="">— ללא אחראי —</option>
          <option value="עידן נבט">👤 עידן נבט</option>
          <option value="ירין סעדון">👤 ירין סעדון</option>
          <option value="ירדן סעדון">👤 ירדן סעדון</option>
        </select>
      </div>
      <div class="frow">
        <div class="fg">
          <label class="fl">משך משוער (דקות)</label>
          <input type="number" min="5" step="15" class="fi" id="mEstDur" placeholder="לדוג׳ 60">
        </div>
        <div class="fg">
          <label class="fl">מועד עבודה מתוכנן</label>
          <input type="datetime-local" class="fi" id="mSchedStart">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeMModal()">ביטול</button>
      <button class="btn btn-primary" onclick="saveMission()">שמור משימה</button>
    </div>
  </div>
</div>

<!-- ═══ Section Modal ═══ -->
<div class="overlay" id="sOverlay">
  <div class="modal" style="max-width:400px;">
    <div class="modal-head">
      <div class="modal-title" id="sTitle">קטגוריה חדשה</div>
      <button class="modal-close" onclick="closeSModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label class="fl">שם קטגוריה *</label>
        <input class="fi" id="sName" placeholder="לדוג׳ פיתוח, שיווק, מחקר...">
      </div>
      <div class="fg">
        <label class="fl">אייקון</label>
        <div class="eg" id="emojiGrid"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeSModal()">ביטול</button>
      <button class="btn btn-primary" onclick="saveSection()">שמור קטגוריה</button>
    </div>
  </div>
</div>

<!-- ═══ Delete Confirm Modal ═══ -->
<div class="overlay" id="dOverlay">
  <div class="modal" style="max-width:380px;">
    <div class="modal-head">
      <div class="modal-title">⚠️ אישור מחיקה</div>
      <button class="modal-close" onclick="closeDModal()">✕</button>
    </div>
    <div class="modal-body">
      <p id="dText" style="font-size:13.5px;color:var(--gray-700);line-height:1.7;"></p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeDModal()">ביטול</button>
      <button class="btn btn-danger" id="dConfirm">מחק</button>
    </div>
  </div>
</div>

<!-- ═══ Schedule Proposal Modal ═══ -->
<div class="sched-overlay" id="schedOverlay">
  <div class="sched-modal">
    <div class="sched-head">
      <div>
        <div class="modal-title">🪄 הצעת תכנון לוח זמנים</div>
        <div class="sched-summary" id="schedSummary" style="margin-top:8px;"></div>
      </div>
      <button class="modal-close" onclick="closeSchedModal()">✕</button>
    </div>
    <div class="sched-list" id="schedList"></div>
    <div class="sched-foot">
      <button class="btn btn-ghost" onclick="closeSchedModal()">בטל</button>
      <button class="btn btn-primary" onclick="applySchedule()">✅ החל את התכנון</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Constants
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const EMOJIS = [
  '📁','🚀','💡','🔥','⚡','🎯','🛠️','📊',
  '🌟','🎨','💼','🔬','📱','🌐','🏆','💪',
  '🎪','🔧','📝','🎭','🌈','🦋','🤖','💎',
  '🏗️','📌','🎸','🚂','🌊','🔑','🧩','🎮',
];
const ALL_SEC_ID   = '__all__';
const STATUS_CSS   = { 'todo':'s-todo','in-progress':'s-prog','done':'s-done','blocked':'s-block' };
const STATUS_LABEL = { 'todo':'ממתין','in-progress':'בתהליך','done':'הושלם','blocked':'חסום' };
const STATUS_ICON  = { 'todo':'📋','in-progress':'⚡','done':'✅','blocked':'🚫' };
const PRIORITY_LBL = { high:'🔴 גבוהה', medium:'🟡 בינונית', low:'🟢 נמוכה' };
const MAX_FILE_BYTES = 3 * 1024 * 1024; // 3 MB per file

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// State

const HE_WEEKDAYS = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','שבת'];
const HE_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  sections: [], missions: [],

  selEmoji: '📁', openDetailId: null,
  view: 'board',

  aiBusy: false,
  schedProposal: null,
  schedBusy: false,
};

// ── Cloud sync (Cloudflare Workers + KV) ──
const API_URL    = 'https://mission-control-api.idan-nevet.workers.dev/';
const API_SECRET = '2f6c1b430633a87bc4535620faf68829ab727bf52c5f29db';
let   _lastRemoteHash = '';
let   _pollTimer = null;

function _apiHeaders() {
  return { 'Content-Type': 'application/json', 'X-Secret': API_SECRET };
}

// Strip base64 file data before sending to cloud (files stay local)
function _missionsForCloud() {
  return S.missions.map(m => ({
    ...m,
    files: (m.files || []).map(({ data, ...meta }) => meta),
  }));
}

// Merge cloud missions with local file data
function _mergeMissions(cloudMissions) {
  return cloudMissions.map(cm => {
    const local = S.missions.find(lm => lm.id === cm.id);
    return { ...cm, files: (cm.files || []).map(cf => {
      const lf = (local?.files || []).find(f => f.id === cf.id);
      return lf ? { ...cf, data: lf.data } : cf;
    })};
  });
}

function _setSyncStatus(ok) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncTxt');
  if (!dot) return;
  dot.style.background = ok ? '#22c55e' : '#ef4444';
  txt.textContent = ok ? 'מסונכרן ☁️' : 'לא מחובר';
  txt.style.color  = ok ? 'rgba(255,255,255,.7)' : '#fca5a5';
}

async function cloudLoad() {
  try {
    const res  = await fetch(API_URL, { headers: _apiHeaders() });
    const data = await res.json();
    _lastRemoteHash = JSON.stringify(data);
    S.sections = data.sections || [];
    S.missions = _mergeMissions(data.missions || []);
    _saveLocal();
    _setSyncStatus(true);
  } catch(e) {
    _loadLocal();
    _setSyncStatus(false);
  }
}

async function cloudSave() {
  const payload = { sections: S.sections, missions: _missionsForCloud() };
  _lastRemoteHash = JSON.stringify(payload);
  _saveLocal();
  try {
    await fetch(API_URL, { method:'POST', headers: _apiHeaders(), body: JSON.stringify(payload) });
    _setSyncStatus(true);
  } catch(e) { _setSyncStatus(false); }
}

async function _pollRemote() {
  try {
    const res  = await fetch(API_URL, { headers: _apiHeaders() });
    const data = await res.json();
    const hash = JSON.stringify(data);
    if (hash !== _lastRemoteHash) {
      _lastRemoteHash = hash;
      S.sections = data.sections || [];
      S.missions = _mergeMissions(data.missions || []);
      _saveLocal();
      render();
      if (S.openDetailId) refreshDetail();
    }
  } catch(e) {}
}

function startPolling() {
  clearInterval(_pollTimer);
  _pollTimer = setInterval(_pollRemote, 15000); // every 15 s
}

function _saveLocal() {
  try { localStorage.setItem('mc_v1', JSON.stringify({ sections: S.sections, missions: S.missions })); } catch(e) {}
}
function _loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem('mc_v1') || '{}');
    S.sections = d.sections || [];
    S.missions = d.missions || [];
  } catch(e) {}
}

// Legacy aliases used throughout the app
function load() { _loadLocal(); }
function save()  { cloudSave(); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function renderBoard() {

  if (!S.activeSecId) {
    el.innerHTML = `<div class="welcome">
      <div class="welcome-ico">🚀</div>
      <div class="welcome-t">ברוכים הבאים למרכז המשימות</div>
      <div class="welcome-sub">צור קטגוריה כדי להתחיל לארגן את המשימות שלך.</div>
      <button class="btn btn-primary" onclick="openSecModal()">+ צור קטגוריה ראשונה</button>
    </div>`;
    return;
  }

  const pool = isAllView
    ? [...S.missions]
    : S.missions.filter(m => m.secId === S.activeSecId);

  const sec = isAllView ? { emoji:'🌐', name:'כל המשימות' } : S.sections.find(s => s.id === S.activeSecId);
  if (!sec) return;

  let shown = [...pool];
  if (S.filter !== 'all') shown = shown.filter(m => m.status === S.filter);
  if (S.search) {
    const q = S.search.toLowerCase();
    shown = shown.filter(m => m.name.toLowerCase().includes(q) || (m.desc||'').toLowerCase().includes(q));
  }
  const counts = {
    all: pool.length,
    todo: pool.filter(m=>m.status==='todo').length,
    'in-progress': pool.filter(m=>m.status==='in-progress').length,
    done: pool.filter(m=>m.status==='done').length,
    blocked: pool.filter(m=>m.status==='blocked').length,
  };
  const subLine = isAllView
    ? `${pool.length} משימות מכל הקטגוריות`
    : `${pool.length} משימות בקטגוריה זו`;

  el.innerHTML = `
  <div class="main-header">
    <div>
      <div class="main-h1">${sec.emoji} ${esc(sec.name)}</div>
      <div class="main-sub">${subLine}</div>
    </div>
    <div class="main-header-right">
      <button class="btn btn-primary btn-sm" onclick="openMModal()">+ הוסף משימה</button>
    </div>
  </div>
  <div class="filter-bar">
    ${fpill('all','הכל',counts.all)}
    ${fpill('todo','📋 ממתין',counts.todo)}
    ${fpill('in-progress','⚡ בתהליך',counts['in-progress'])}
    ${fpill('done','✅ הושלם',counts.done)}
    ${fpill('blocked','🚫 חסום',counts.blocked)}
  </div>

    ${shown.length ? `<div class="missions-grid">${shown.map(m => mcard(m, isAllView)).join('')}</div>` : emptyState()}

}

function fpill(f, label, n) {
  const fc = f==='all'?'f-all':f==='in-progress'?'f-prog':f==='done'?'f-done':f==='blocked'?'f-block':'f-todo';
  return `<div class="fpill ${fc} ${S.filter===f?'active':''}" onclick="setFilter('${f}')">${label} <span class="cnt">${n}</span></div>`;
}

  const css = STATUS_CSS[m.status]||'s-todo';
  const dl  = deadlineInfo(m.deadline);
  const nc  = (m.comments||[]).length;
  const nf  = (m.files||[]).length;
  const sec = showSection ? S.sections.find(s => s.id === m.secId) : null;
  return `<div class="mcard ${css}" onclick="openDetail('${m.id}')">
    <div class="mcard-head">
      <div class="mcard-title">${esc(m.name)}</div>
      <div class="mcard-actions">
        <button class="icon-btn" onclick="event.stopPropagation();openMModal('${m.id}')" title="עריכה" style="color:var(--gray-500)">✏️</button>
        <button class="icon-btn" onclick="event.stopPropagation();confirmDelMission('${m.id}')" title="מחיקה" style="color:var(--red)">🗑️</button>
      </div>
    </div>
    ${sec ? `<div style="font-size:11.5px;color:var(--gray-500);margin-bottom:8px;">${sec.emoji} ${esc(sec.name)}</div>` : ''}
    ${m.desc?`<div class="mcard-desc">${esc(m.desc)}</div>`:''}
    <div class="mcard-meta">
      <span class="sbadge ${css}">${STATUS_ICON[m.status]} ${STATUS_LABEL[m.status]}</span>
      ${dl?`<span class="dline ${dl.cls}">📅 ${dl.txt}</span>`:''}
      ${m.priority?`<span class="pdot ${m.priority}" title="${PRIORITY_LBL[m.priority]}"></span>`:''}
      ${m.owner?`<span class="ccount">👤 ${esc(m.owner)}</span>`:''}
      ${nf?`<span class="ccount">📎 ${nf}</span>`:''}
      ${nc?`<span class="ccount">💬 ${nc}</span>`:''}

}

    <div class="status-opts">
      ${['todo','in-progress','done','blocked'].map(st => {
        const css = STATUS_CSS[st], sel = m.status===st?'sel':'';

function fileItemHtml(missionId, f) {
  const isImg = f.type.startsWith('image/');
  return `<div class="file-item">
    ${isImg
      ? `<img id="fthumb-${f.id}" class="file-thumb" alt="${esc(f.name)}">`
      : `<div class="file-ico">${fileIcon(f.type)}</div>`}
    <div class="file-info">
      <div class="file-name">${esc(f.name)}</div>
      <div class="file-size">${fmtSize(f.size)}</div>
    </div>
    <div class="file-actions">
      <button class="icon-btn" onclick="downloadFile('${missionId}','${f.id}')" title="הורדה" style="opacity:.7;font-size:15px;">⬇️</button>
      <button class="icon-btn" onclick="removeFile('${missionId}','${f.id}')" title="מחק" style="color:var(--red);opacity:.7">🗑️</button>
    </div>
  </div>`;
}

function fileIcon(type) {
  if (type.includes('pdf'))   return '📄';
  if (type.includes('word') || type.includes('document')) return '📝';
  if (type.includes('sheet') || type.includes('excel'))   return '📊';
  if (type.includes('zip') || type.includes('rar') || type.includes('7z')) return '🗜️';
  if (type.includes('video')) return '🎬';
  if (type.includes('audio')) return '🎵';
  if (type.includes('text'))  return '📃';
  return '📎';
}

function closeDetail() {
  S.openDetailId = null;
  document.getElementById('detailBg').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
}
function editCurrent() { if (S.openDetailId) openMModal(S.openDetailId); }
function setStatus(id, status) {
  const m = S.missions.find(x => x.id === id);
  if (!m) return;
  m.status = status;
  save(); refreshDetail(); render();
  toast(`סטטוס עודכן: ${STATUS_LABEL[status]}`);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// File Upload
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function handleFileUpload(missionId, input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  const m = S.missions.find(x => x.id === missionId);
  if (!m) return;
  if (!m.files) m.files = [];

  let added = 0;
  for (const file of files) {
    if (file.size > MAX_FILE_BYTES) {
      toast(`"${file.name}" גדול מדי (מקסימום 3MB)`, 'error');
      continue;
    }
    const data = await fileToBase64(file);
    m.files.push({ id: uid(), name: file.name, type: file.type, size: file.size, data });
    added++;
  }
  input.value = '';
  if (added) { save(); refreshDetail(); render(); toast(`${added} קובץ הועלה בהצלחה`, 'success'); }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function downloadFile(missionId, fileId) {
  const m = S.missions.find(x => x.id === missionId);
  const f = (m?.files||[]).find(x => x.id === fileId);
  if (!f) return;
  const a = document.createElement('a');
  a.href = f.data;
  a.download = f.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function removeFile(missionId, fileId) {
  const m = S.missions.find(x => x.id === missionId);
  if (!m) return;
  m.files = (m.files||[]).filter(f => f.id !== fileId);
  save(); refreshDetail(); render(); toast('קובץ נמחק');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Export / Import  (solves cross-browser issue)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function exportData() {
  const json = JSON.stringify({ sections: S.sections, missions: S.missions }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mission-control-${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('הנתונים יוצאו בהצלחה (כולל קבצים)', 'success');
}

async function importData(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data.sections) || !Array.isArray(data.missions)) throw new Error();
    S.sections = data.sections;
    S.missions = data.missions;
    S.activeSecId = ALL_SEC_ID;
    save(); render();
    toast(`יובאו ${S.sections.length} קטגוריות ו-${S.missions.length} משימות`, 'success');
  } catch(e) {
    toast('קובץ לא תקין — ייבוא נכשל', 'error');
  }
  input.value = '';
}

// Calendar View
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderCalendar() {
  const el = document.getElementById('main');
  const ownerCounts = OWNERS.reduce((acc, o) => {
    acc[o] = S.missions.filter(m => m.owner === o).length;
    return acc;
  }, {});
  const allCnt = S.missions.length;

  const ownerTabs = `
    <div class="otab ${S.calOwner==='__all__'?'active':''}" onclick="setCalOwner('__all__')">🌐 הכל <span class="ocnt">${allCnt}</span></div>
    ${OWNERS.map(o => `<div class="otab ${S.calOwner===o?'active':''}" onclick="setCalOwner('${o}')">👤 ${o} <span class="ocnt">${ownerCounts[o]}</span></div>`).join('')}
  `;

  const ownerLabel = S.calOwner === '__all__' ? 'כל האחראים' : S.calOwner;
  const title = calBarTitle();

  el.innerHTML = `
  <div class="main-header">
    <div>
      <div class="main-h1">📅 לוח שנה — ${esc(ownerLabel)}</div>
      <div class="main-sub">${calSubLine()}</div>
    </div>
    <div class="main-header-right">
      <button class="btn btn-primary btn-sm" onclick="proposeSchedule()" ${S.schedBusy?'disabled':''}>${S.schedBusy?'⏳ בונה תכנון…':'🪄 תכנן את השבוע'}</button>
    </div>
  </div>
  <div class="owner-tabs">${ownerTabs}</div>
  <div class="cal-bar">
    <div style="display:flex;gap:14px;align-items:center;">
      <div class="cal-title">${title}</div>
      <div class="cal-mode-tabs">
        <button class="cal-mode-tab ${S.calMode==='month'?'active':''}" onclick="setCalMode('month')">חודש</button>
        <button class="cal-mode-tab ${S.calMode==='week'?'active':''}"  onclick="setCalMode('week')">שבוע</button>
        <button class="cal-mode-tab ${S.calMode==='day'?'active':''}"   onclick="setCalMode('day')">יום</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="cal-today" onclick="calToday()">היום</button>
      <div class="cal-nav">
        <button onclick="calNav(-1)" title="הקודם">›</button>
        <button onclick="calNav(1)" title="הבא">‹</button>
      </div>
    </div>
  </div>
  <div id="calContent"></div>`;

  if      (S.calMode === 'week') renderCalWeek();
  else if (S.calMode === 'day')  renderCalDay();
  else                           renderCalMonth();
}

function calBarTitle() {
  const c = S.calCursor;
  if (S.calMode === 'month') return `${HE_MONTHS[c.getMonth()]} ${c.getFullYear()}`;
  if (S.calMode === 'day')   return `${HE_WEEKDAYS[c.getDay()]} · ${c.getDate()} ${HE_MONTHS[c.getMonth()]} ${c.getFullYear()}`;
  // week
  const ws = weekStart(c);
  const we = new Date(ws); we.setDate(ws.getDate()+6);
  if (ws.getMonth() === we.getMonth()) return `${ws.getDate()}–${we.getDate()} ${HE_MONTHS[ws.getMonth()]} ${ws.getFullYear()}`;
  return `${ws.getDate()} ${HE_MONTHS[ws.getMonth()]} – ${we.getDate()} ${HE_MONTHS[we.getMonth()]} ${we.getFullYear()}`;
}
function calSubLine() {
  const f = filteredMissions();
  return `${f.length} משימות${S.calMode==='month'?'':' (לפי שעה)'}`;
}
function filteredMissions() {
  return S.missions.filter(mi => {
    if (S.calOwner !== '__all__' && mi.owner !== S.calOwner) return false;
    return true;
  });
}
function weekStart(d) {  // Sunday
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - x.getDay());
  return x;
}

// ─── Month view (existing layout) ───
function renderCalMonth() {
  const c = S.calCursor;
  const y = c.getFullYear(), m = c.getMonth();
  const monthMissions = filteredMissions().filter(mi => mi.deadline);
  const noDeadline = filteredMissions().filter(mi => !mi.deadline);

  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) {
    const d = prevDays - startDow + 1 + i;
    cells.push({ d, other: true, date: new Date(y, m-1, d) });
  }
  for (let d = 1; d <= daysInMonth; d++) cells.push({ d, other: false, date: new Date(y, m, d) });
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length-1].date;
    const next = new Date(last.getFullYear(), last.getMonth(), last.getDate()+1);
    cells.push({ d: next.getDate(), other: true, date: next });
  }
  const today = new Date(); today.setHours(0,0,0,0);

  document.getElementById('calContent').innerHTML = `
    <div class="cal-grid">
      <div class="cal-weekhead">${HE_WEEKDAYS.map(d => `<div class="cal-weekday">${d}</div>`).join('')}</div>
      <div class="cal-days">
        ${cells.map(c => {
          const isToday = c.date.getTime() === today.getTime();
          const dayMissions = monthMissions.filter(mi => sameDay(missionDate(mi), c.date));
          return `<div class="cal-day ${c.other?'other':''} ${isToday?'today':''}">
            <div class="cal-daynum">${c.d}</div>
            ${dayMissions.map(mi => calChip(mi)).join('')}
          </div>`;
        }).join('')}
      </div>
    </div>
    ${noDeadline.length ? `
      <div class="cal-noddl">
        <strong>${noDeadline.length} משימות ללא תאריך יעד</strong> — לא יוצגו בלוח עד שיוגדר תאריך:
        <div class="cal-noddl-list">
          ${noDeadline.slice(0,12).map(mi => `<span class="cal-noddl-item" onclick="openDetail('${mi.id}')">${esc(mi.name)}</span>`).join('')}
          ${noDeadline.length>12 ? `<span class="cal-noddl-item">+ ${noDeadline.length-12} נוספות…</span>` : ''}
        </div>
      </div>` : ''}`;
}

// ─── Week / Day time-grid view ───
function renderCalWeek() { renderTimeGrid(7); }
function renderCalDay()  { renderTimeGrid(1); }

function renderTimeGrid(numDays) {
  const today = new Date(); today.setHours(0,0,0,0);
  const start = numDays === 7 ? weekStart(S.calCursor) : new Date(S.calCursor.getFullYear(), S.calCursor.getMonth(), S.calCursor.getDate());
  const days = Array.from({length: numDays}, (_, i) => {
    const d = new Date(start); d.setDate(start.getDate()+i); return d;
  });
  const modeCls = numDays === 7 ? 'mode-week' : 'mode-day';

  const headHtml = `
    <div class="cal-week-head ${modeCls}">
      <div class="cal-headcell"></div>
      ${days.map(d => {
        const isToday = sameDay(d, today);
        return `<div class="cal-headcell ${isToday?'today':''}">
          <span class="dayname">${HE_WEEKDAYS[d.getDay()]}</span>
          <span class="dayno">${d.getDate()}/${d.getMonth()+1}</span>
        </div>`;
      }).join('')}
    </div>`;

  const hours = [];
  for (let h = CAL_HOUR_START; h <= CAL_HOUR_END; h++) {
    hours.push(`<div class="cal-time-cell">${String(h).padStart(2,'0')}:00</div>`);
  }

  const dayCols = days.map(d => {
    const isToday = sameDay(d, today);
    const items = filteredMissions().map(m => {
      const block = missionBlock(m, d);
      return block;
    }).filter(Boolean);
    const nowLine = isToday ? nowLineHtml() : '';
    return `<div class="cal-day-col ${isToday?'today':''}">${nowLine}${items.join('')}</div>`;
  }).join('');

  const bodyHeight = (CAL_HOUR_END - CAL_HOUR_START + 1) * CAL_HOUR_PX;

  document.getElementById('calContent').innerHTML = `
    <div class="cal-week-wrap">
      ${headHtml}
      <div class="cal-week-body ${modeCls}" style="height:${bodyHeight + 4}px;">
        <div class="cal-time-col">${hours.join('')}</div>
        ${dayCols}
      </div>
    </div>`;
}

function missionBlock(m, day) {
  // Pick anchor time: scheduledStart if set, else deadline (only if it has a time)
  let anchor = null, isDeadline = false;
  if (m.scheduledStart) anchor = new Date(m.scheduledStart);
  else if (m.deadline && m.deadline.includes('T')) { anchor = new Date(m.deadline); isDeadline = true; }
  if (!anchor) return null;
  if (!sameDay(anchor, day)) return null;

  const startMin = anchor.getHours() * 60 + anchor.getMinutes();
  const baseMin  = CAL_HOUR_START * 60;
  const endMin   = (CAL_HOUR_END + 1) * 60;
  if (startMin >= endMin) return null;

  const dur = m.estDuration || (isDeadline ? 30 : 60);
  const top = Math.max(0, (startMin - baseMin) * (CAL_HOUR_PX / 60));
  const height = Math.max(22, dur * (CAL_HOUR_PX / 60) - 2);
  const css = STATUS_CSS[m.status] || 's-todo';
  const dlOnly = isDeadline ? ' deadline-only' : '';
  const timeLbl = anchor.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  const tip = `${m.name}${m.owner?' — '+m.owner:''} (${timeLbl}, ${dur} דק׳)${isDeadline?' · יעד':''}`;
  return `<div class="cal-mblock ${css}${dlOnly}" style="top:${top}px;height:${height}px;" onclick="openDetail('${m.id}')" title="${esc(tip)}">
    <span class="cal-mblock-time">${timeLbl}${isDeadline?' 🎯':''}</span>
    <span class="cal-mblock-name">${esc(m.name)}</span>
  </div>`;
}

function nowLineHtml() {
  const now = new Date();
  const min = now.getHours()*60 + now.getMinutes();
  const baseMin = CAL_HOUR_START*60;
  const endMin = (CAL_HOUR_END+1)*60;
  if (min < baseMin || min > endMin) return '';
  const top = (min - baseMin) * (CAL_HOUR_PX / 60);
  return `<div class="cal-now-line" style="top:${top}px;"></div>`;
}

function missionDate(m) {
  return new Date(m.deadline.includes('T') ? m.deadline : m.deadline+'T00:00:00');
}

function calChip(m) {
  const css = STATUS_CSS[m.status] || 's-todo';
  const d = missionDate(m);
  const hasTime = m.deadline.includes('T');
  const t = hasTime ? d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}) : '';
  return `<div class="cal-mchip ${css}" onclick="openDetail('${m.id}')" title="${esc(m.name)}${t?' — '+t:''}">
    ${t?`<span class="cal-mchip-time">${t}</span>`:''}${esc(m.name)}
  </div>`;
}

function sameDay(a, b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function setCalOwner(o) { S.calOwner = o; renderCalendar(); }
function setCalMode(mode) { S.calMode = mode; renderCalendar(); }
function calNav(delta) {
  const c = new Date(S.calCursor);
  if (S.calMode === 'month') c.setMonth(c.getMonth() + delta);
  else if (S.calMode === 'week') c.setDate(c.getDate() + delta * 7);
  else c.setDate(c.getDate() + delta);
  S.calCursor = c;
  renderCalendar();
}
function calToday() { S.calCursor = new Date(); renderCalendar(); }

// ─── AI scheduling: propose / preview / apply ───
async function proposeSchedule() {
  if (S.schedBusy) return;
  S.schedBusy = true;
  renderCalendar();
  try {
    const ws = weekStart(new Date());
    const weekStartIso = `${ws.getFullYear()}-${String(ws.getMonth()+1).padStart(2,'0')}-${String(ws.getDate()).padStart(2,'0')}`;
    const res = await fetch(API_URL + 'ai/schedule', {
      method: 'POST',
      headers: _apiHeaders(),
      body: JSON.stringify({
        sections: S.sections,
        missions: _missionsForCloud(),
        weekStart: weekStartIso,
        workStart: '09:00',
        workEnd:   '18:00',
        workDays:  [0,1,2,3,4], // Sun-Thu
      }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err || ('HTTP '+res.status));
    }
    const data = await res.json();
    S.schedProposal = data;
    showSchedModal();
  } catch (e) {
    toast('שגיאה בתכנון: ' + (e.message||''), 'error');
  } finally {
    S.schedBusy = false;
    renderCalendar();
  }
}

function showSchedModal() {
  if (!S.schedProposal) return;
  document.getElementById('schedSummary').textContent = S.schedProposal.summary || '';
  const list = (S.schedProposal.schedule || []).map(s => {
    const m = S.missions.find(x => x.id === s.mission_id);
    if (!m) return '';
    const startD = new Date(s.start_iso);
    const when = `${HE_WEEKDAYS[startD.getDay()]} ${startD.getDate()}/${startD.getMonth()+1} · ${startD.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}`;
    return `<div class="sched-item">
      <div class="sched-item-head">
        <div class="sched-item-name">${esc(m.name)}</div>
        <span class="sched-item-when">${when}</span>
        <span class="sched-item-meta">${s.duration_minutes} דק׳${m.owner?' · '+esc(m.owner):''}</span>
      </div>
      ${s.reasoning?`<div class="sched-item-reason">${esc(s.reasoning)}</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('schedList').innerHTML = list || '<div style="text-align:center;color:var(--gray-500);padding:30px;">לא הוצעה תוכנית</div>';
  document.getElementById('schedOverlay').classList.add('open');
}

function closeSchedModal() {
  document.getElementById('schedOverlay').classList.remove('open');
  S.schedProposal = null;
}

function applySchedule() {
  if (!S.schedProposal) return;
  let applied = 0;
  (S.schedProposal.schedule || []).forEach(s => {
    const m = S.missions.find(x => x.id === s.mission_id);
    if (!m) return;
    m.scheduledStart = s.start_iso;
    m.estDuration   = s.duration_minutes;
    applied++;
  });
  save();
  closeSchedModal();
  render();
  toast(`${applied} משימות תוזמנו בלוח השנה`, 'success');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// AI Assistant View
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderAI() {
  const el = document.getElementById('main');
  const empty = S.aiHistory.length === 0;
  el.innerHTML = `
  <div class="main-header">
    <div>
      <div class="main-h1">🤖 עוזר AI לניהול משימות</div>
      <div class="main-sub">שאל שאלות על המשימות, קבל המלצות עדיפויות וניתוחי עומס · מופעל ע"י Claude</div>
    </div>
    <div class="main-header-right">
      <button class="btn btn-ghost btn-sm" onclick="aiClear()" title="נקה שיחה">🗑️ נקה</button>
    </div>
  </div>
  <div class="ai-wrap">
    <div class="ai-quick">
      <button class="ai-qbtn" onclick="aiQuick('סדר לי את המשימות לפי עדיפות וזמן — מה הכי דחוף?')">📌 מה דחוף עכשיו?</button>
      <button class="ai-qbtn" onclick="aiQuick('מי האחראי הכי עמוס? יש העמסה לא מאוזנת בין הצוות?')">⚖️ ניתוח עומס</button>
      <button class="ai-qbtn" onclick="aiQuick('אילו משימות באיחור או עומדות לאחר?')">⏰ איחורים</button>
      <button class="ai-qbtn" onclick="aiQuick('הצע לי תוכנית עבודה לשבוע הקרוב')">📅 תוכנית שבועית</button>
      <button class="ai-qbtn" onclick="proposeSchedule()" ${S.schedBusy?'disabled':''}>${S.schedBusy?'⏳ בונה תכנון…':'🪄 תכנן את השבוע (תוזמן בלוח)'}</button>
      <button class="ai-qbtn" onclick="aiOrganize()">⚡ סדר אוטומטי (מקומי)</button>
    </div>
    <div class="ai-chat" id="aiChat">
      ${empty ? `<div class="ai-empty">
        <div class="ico">🤖</div>
        <div class="t">איך אפשר לעזור?</div>
        <div class="s">אני רואה את כל המשימות שלך — סטטוסים, אחראים, תאריכים ועדיפויות. שאל אותי כל שאלה או לחץ על אחד הכפתורים למעלה.</div>
      </div>` : S.aiHistory.map(aiMsgHtml).join('')}
    </div>
    <div class="ai-input-row">
      <input class="ai-input" id="aiInput" placeholder="שאל שאלה על המשימות..." onkeydown="if(event.key==='Enter')aiSend()" ${S.aiBusy?'disabled':''}>
      <button class="btn btn-primary" onclick="aiSend()" ${S.aiBusy?'disabled':''}>${S.aiBusy?'⏳':'שלח'}</button>
    </div>
  </div>`;
  const chat = document.getElementById('aiChat');
  if (chat) chat.scrollTop = chat.scrollHeight;
  setTimeout(() => { const i = document.getElementById('aiInput'); if (i && !S.aiBusy) i.focus(); }, 50);
}

function aiMsgHtml(msg) {
  const isUser = msg.role === 'user';
  const cls = isUser ? 'user' : 'bot';
  const av  = isUser ? '👤' : '🤖';
  const bubbleCls = msg.thinking ? 'ai-bubble thinking' : 'ai-bubble';
  return `<div class="ai-msg ${cls}">
    <div class="ai-avatar">${av}</div>
    <div class="${bubbleCls}">${esc(msg.content)}</div>
  </div>`;
}

function aiQuick(q) {
  const inp = document.getElementById('aiInput');
  if (inp) inp.value = q;
  aiSend();
}
function aiClear() { S.aiHistory = []; renderAI(); }

async function aiSend() {
  if (S.aiBusy) return;
  const inp = document.getElementById('aiInput');
  const text = (inp?.value || '').trim();
  if (!text) return;
  inp.value = '';
  S.aiHistory.push({ role: 'user', content: text });
  S.aiHistory.push({ role: 'assistant', content: 'חושב…', thinking: true });
  S.aiBusy = true;
  renderAI();

  try {
    const history = S.aiHistory
      .filter(m => !m.thinking)
      .slice(0, -1) // exclude the just-added user msg (sent separately as userMessage)
      .map(m => ({ role: m.role, content: m.content }));
    const res = await fetch(API_URL + 'ai', {
      method: 'POST',
      headers: _apiHeaders(),
      body: JSON.stringify({
        sections: S.sections,
        missions: _missionsForCloud(),
        history,
        userMessage: text,
      }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err || ('HTTP '+res.status));
    }
    const data = await res.json();
    S.aiHistory = S.aiHistory.filter(m => !m.thinking);
    S.aiHistory.push({ role: 'assistant', content: data.text || '(ללא תשובה)' });
  } catch (e) {
    S.aiHistory = S.aiHistory.filter(m => !m.thinking);
    S.aiHistory.push({ role: 'assistant', content: '⚠️ שגיאה: לא הצלחתי לקבל תשובה. ' + (e.message||'') });
  } finally {
    S.aiBusy = false;
    renderAI();
  }
}

// Rule-based local organizer (no API call, instant)
function aiOrganize() {
  const now = new Date();
  const overdue = [];
  const today = [];
  const soon = [];
  const blocked = [];
  const noOwner = [];
  const noDeadline = [];

  S.missions.filter(m => m.status !== 'done').forEach(m => {
    if (m.status === 'blocked') blocked.push(m);
    if (!m.owner) noOwner.push(m);
    if (!m.deadline) { noDeadline.push(m); return; }
    const d = new Date(m.deadline.includes('T') ? m.deadline : m.deadline+'T23:59');
    const diffH = (d - now) / 3600000;
    if (diffH < 0) overdue.push({ m, diffH });
    else if (diffH < 24) today.push({ m, diffH });
    else if (diffH < 24*7) soon.push({ m, diffH });
  });

  overdue.sort((a,b) => a.diffH - b.diffH);
  today.sort((a,b) => a.diffH - b.diffH);
  soon.sort((a,b) => a.diffH - b.diffH);

  const ownerLoad = OWNERS.map(o => ({
    o,
    n: S.missions.filter(m => m.owner === o && m.status !== 'done').length
  }));
  ownerLoad.sort((a,b) => b.n - a.n);

  const fmtMission = m => `• ${m.name}${m.owner?` (${m.owner})`:''}${m.priority==='high'?' 🔴':''}`;
  const sections = [];

  if (overdue.length) sections.push(`🚨 *באיחור* (${overdue.length}):\n${overdue.slice(0,8).map(x=>fmtMission(x.m)).join('\n')}`);
  if (today.length)   sections.push(`⏰ *עד היום* (${today.length}):\n${today.slice(0,8).map(x=>fmtMission(x.m)).join('\n')}`);
  if (soon.length)    sections.push(`📅 *השבוע הקרוב* (${soon.length}):\n${soon.slice(0,8).map(x=>fmtMission(x.m)).join('\n')}`);
  if (blocked.length) sections.push(`🚫 *חסומות* (${blocked.length}):\n${blocked.slice(0,5).map(fmtMission).join('\n')}`);

  sections.push(`👥 *עומס לפי אחראי*:\n${ownerLoad.map(x => `• ${x.o}: ${x.n} משימות פתוחות`).join('\n')}`);

  if (noOwner.length)    sections.push(`⚠️ ${noOwner.length} משימות ללא אחראי — מומלץ להקצות`);
  if (noDeadline.length) sections.push(`📌 ${noDeadline.length} משימות ללא תאריך יעד`);

  if (!overdue.length && !today.length && !soon.length) {
    sections.unshift('✨ אין משימות דחופות לשבוע הקרוב — עבודה טובה!');
  }

  const summary = sections.join('\n\n');
  S.aiHistory.push({ role: 'user', content: '⚡ סדר אוטומטי' });
  S.aiHistory.push({ role: 'assistant', content: summary });
  renderAI();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Helpers
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(s) {
  if (!s) return '';
  const hasTime = s.includes('T');
  const d = new Date(hasTime ? s : s+'T00:00:00');
  const dateStr = d.toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});
  if (!hasTime) return dateStr;
  const timeStr = d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  return `${dateStr} ${timeStr}`;
}
function fmtSize(b) {
  if (b<1024) return `${b} B`;
  if (b<1048576) return `${(b/1024).toFixed(1)} KB`;
  return `${(b/1048576).toFixed(1)} MB`;
}
function deadlineInfo(s) {
  if (!s) return null;
  const hasTime = s.includes('T');
  const now = new Date();
  if (hasTime) {
    const d = new Date(s);
    const diffMs = d - now;
    if (diffMs < 0) {
      const mins = Math.round(-diffMs/60000);
      if (mins < 60)  return { txt:`באיחור של ${mins} דק׳`,            cls:'overdue' };
      const hrs = Math.round(-diffMs/3600000);
      if (hrs < 24)   return { txt:`באיחור של ${hrs} שעות`,            cls:'overdue' };
      const days = Math.round(-diffMs/86400000);
      return { txt:`באיחור של ${days} ימים`, cls:'overdue' };
    }
    const mins = Math.round(diffMs/60000);
    if (mins < 60)    return { txt:`עוד ${mins} דק׳`,                  cls:'soon' };
    const hrs = Math.round(diffMs/3600000);
    if (hrs < 24)     return { txt:`עוד ${hrs} שעות`,                  cls:'soon' };
    const days = Math.round(diffMs/86400000);
    if (days <= 3)    return { txt:`נותרו ${days} ימים`,               cls:'soon' };
    return { txt:fmtDate(s), cls:'' };
  }
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(s+'T00:00:00');
  const diff=Math.round((d-today)/86400000);
  if (diff<0)  return { txt:`באיחור של ${Math.abs(diff)} ימים`, cls:'overdue' };
  if (diff===0) return { txt:'היום!',                            cls:'soon'    };
  if (diff<=3) return { txt:`נותרו ${diff} ימים`,               cls:'soon'    };
  return { txt:fmtDate(s), cls:'' };
}
function toast(msg, type='') {
  const w=document.getElementById('toasts');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.innerHTML=`${type==='success'?'✅':type==='error'?'❌':'ℹ️'} ${msg}`;
  w.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(8px)'; setTimeout(()=>t.remove(),280); },2400);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key==='Escape') {
    if (document.getElementById('schedOverlay').classList.contains('open')){ closeSchedModal(); return; }
    if (document.getElementById('mOverlay').classList.contains('open'))   { closeMModal(); return; }
    if (document.getElementById('sOverlay').classList.contains('open'))   { closeSModal(); return; }
    if (document.getElementById('dOverlay').classList.contains('open'))   { closeDModal(); return; }
    if (document.getElementById('detailPanel').classList.contains('open')){ closeDetail(); return; }
  }
});
['mOverlay','sOverlay','dOverlay','schedOverlay'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) {
    if (e.target===this) {
      if (id==='mOverlay')     closeMModal();
      if (id==='sOverlay')     closeSModal();
      if (id==='dOverlay')     closeDModal();
      if (id==='schedOverlay') closeSchedModal();
    }
  });
});
